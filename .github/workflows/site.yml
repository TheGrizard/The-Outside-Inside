# SPDX-License-Identifier: MPL-2.0
# The install site on GitHub Pages (https://TheGrizard.github.io/The-Outside-Inside/): the front page, the web
# installer, the firmware in the browser and the screen reader's words, made by fm1-base's tools/make_site.py from
# the newest release's signed package (the one release.yml built, attested and published). Runs when a release
# build finishes, when this file changes, or by hand (Actions > Install site > Run workflow).
name: Install site

on:
  workflow_run:
    workflows: ["Build and attest firmware"]
    types: [completed]
  push:
    branches: [main]
    paths: ['.github/workflows/site.yml', 'app/site/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: install-site
  cancel-in-progress: false

jobs:
  site:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The newest release, and its source
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '[.[] | select(.draft == false)][0].tag_name')
          [ -n "$tag" ] && [ "$tag" != null ] || { echo 'no release yet'; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#[vV]}" >> "$GITHUB_OUTPUT"
          # the site's page and emulator from the release's own source (its front page from main's, the newest words)
          cp -r app/site /tmp/site-src
          git checkout -q "$tag"
          git submodule update --init --recursive
          rm -rf app/site && cp -r /tmp/site-src app/site
          mkdir -p app/build
          gh release download "$tag" --pattern '*.fwsc' --dir app/build

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: '3.12'

      - name: Tools
        run: |
          set -euo pipefail
          python3 -m pip install -q Pillow
          sudo apt-get install -y -qq libfribidi0
          git clone -q https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" checkout -q a2b92777574c2feda07994cd4f1079a3dfc151f8   # emsdk 6.0.10
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.10
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.10

      - name: The emulator and the site
        env:
          VERSION: ${{ steps.rel.outputs.version }}
        run: |
          set -euo pipefail
          set +u; source "$RUNNER_TEMP/emsdk/emsdk_env.sh"; set -u
          ./build.sh --web --release "$VERSION"
          python3 base/tools/make_site.py app "app/build/the-outside-inside-$VERSION.fwsc" "$VERSION" site
          touch site/.nojekyll

      - name: Publish to the gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          set -euo pipefail
          cd site
          git init -q -b gh-pages
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "Install site for $TAG (from ${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          # GitHub Pages from that branch: switched on here if it can be, else in Settings > Pages
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages" -f 'source[branch]=gh-pages' -f 'source[path]=/' >/dev/null 2>&1 \
            || gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" >/dev/null 2>&1 \
            || echo '::warning::Switch GitHub Pages on: Settings > Pages > Deploy from a branch > gh-pages'
          echo "site: https://$(echo "${GITHUB_REPOSITORY%%/*}" | tr A-Z a-z).github.io/${GITHUB_REPOSITORY#*/}/"
